{% set version = "1.7.2" %}

package:
  name: ddt
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/ddt/ddt-{{ version }}.tar.gz
  sha256: d215d6b083963013c4a19b1e4dcd6a96e80e43ab77519597a6acfcf2e9a3e04b

build:
  number: 1
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - aiounittest >=1.4.0
    - pip
    - pytest-cov
    - pyyaml
    - six >=1.4.0
    - python {{ python_min }}
  source_files:
    - test
  commands:
    - pip check
    - coverage run --source=ddt --branch -m pytest test -vv --tb=long --color=yes -ra
    - coverage report --show-missing --skip-covered --fail-under=97

about:
  home: https://github.com/datadriventests/ddt
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: Data-Driven/Decorated Tests
  description: DDT (Data-Driven Tests) allows you to multiply one test case by running it with different test data, and make it appear as multiple test cases.
  doc_url: https://ddt.readthedocs.io
  doc_source_url: https://github.com/datadriventests/ddt/tree/{{ version }}/docs

extra:
  recipe-maintainers:
    - CJ-Wright
    - bollwyvl
